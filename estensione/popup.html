<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copia sondaggi — formato</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111b21;
      --sub: #667781;
      --border: #e9edef;
      --field: #f0f2f5;
      --accent: #00a884;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #233138;
        --fg: #e9edef;
        --sub: #8696a0;
        --border: #2a3942;
        --field: #2a3942;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 600;
    }
    p.help {
      margin: 0 0 12px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--sub);
    }
    p.help b { color: var(--accent); }
    label.field-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--sub);
      margin: 0 0 6px;
    }
    input#tpl {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--fg);
      font-size: 14px;
      outline: none;
    }
    input#tpl:focus, input#votersTpl:focus, select#lang:focus { border-color: var(--accent); }
    select#lang {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--fg);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    input#votersTpl {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--fg);
      font-size: 14px;
      outline: none;
      margin-top: 8px;
    }
    input#votersTpl:disabled { opacity: .5; }
    label.check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 13.5px;
      cursor: pointer;
    }
    label.check input { accent-color: var(--accent); margin: 0; }
    p.note {
      margin: 6px 0 0;
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--sub);
    }
    p.note b { color: var(--accent); }
    .preview-label { margin-top: 16px; }
    pre#preview {
      margin: 6px 0 0;
      padding: 10px 11px;
      border-radius: 8px;
      background: var(--field);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      padding: 8px 16px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    button.primary { background: var(--accent); color: #fff; }
    button.ghost { background: transparent; color: var(--accent); }
    #reset { margin-right: auto; }
    #saved {
      font-size: 12px;
      color: var(--accent);
      opacity: 0;
      transition: opacity .15s;
    }
    #saved.show { opacity: 1; }
  </style>
</head>
<body>
  <!-- I testi vengono scritti da popup.js nella lingua scelta (i18n.js). -->
  <h1 id="title"></h1>

  <label class="field-label" for="lang" id="langLabel"></label>
  <select id="lang"></select>

  <p class="help" id="help"></p>

  <label class="field-label" for="tpl" id="tplLabel"></label>
  <input id="tpl" type="text" spellcheck="false" autocomplete="off" />

  <label class="check"><input id="voters" type="checkbox" /> <span id="votersLabel"></span></label>
  <input id="votersTpl" type="text" spellcheck="false" autocomplete="off" />
  <p class="note" id="votersNote"></p>

  <label class="field-label preview-label" id="previewLabel"></label>
  <pre id="preview"></pre>

  <div class="row">
    <button id="reset" class="ghost" type="button"></button>
    <span id="saved"></span>
    <button id="save" class="primary" type="button"></button>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
